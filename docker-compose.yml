version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: shopgame-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shopgame
      MYSQL_USER: shopgame_user
      MYSQL_PASSWORD: shopgame_pass
    ports:
      - "3306:3306" # Accessible from external IPs
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shopgame-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: shopgame-backend
    ports:
      - "8080:8080" # Accessible from external IPs
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopgame?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: shopgame_user
      SPRING_DATASOURCE_PASSWORD: shopgame_pass
      UPLOAD_PATH: /app/uploads
      COVER_UPLOAD_PATH: /app/uploads/covers
      MUSIC_UPLOAD_PATH: /app/uploads/music
    volumes:
      - jwt_secret:/app/jwt-secret  # Persist JWT secret across restarts
      - uploads_data:/app/uploads   # Persist uploaded files
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shopgame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: shopgame-frontend
    ports:
      - "4200:80" # Accessible from external IPs
      - "4443:443" # HTTPS support
    depends_on:
      - backend
    networks:
      - shopgame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
  jwt_secret:  # New volume for JWT secret persistence
  uploads_data:  # New volume for uploaded files

networks:
  shopgame-network:
    driver: bridge 
<div class="checkout-modal-outer animate-modal-in">
  <div class="checkout-modal-inner">
    <div class="checkout-header-row">
      <mat-icon class="checkout-header-icon">shopping_cart_checkout</mat-icon>
      <span class="checkout-title">Checkout</span>
    </div>
    <div class="checkout-step">
      <div class="checkout-row payment-type-row">
        <label class="checkout-label">Payment Type:</label>
        <div class="payment-type-list">
          <label class="payment-type-option">
            <input type="radio" name="paymentType" [(ngModel)]="paymentType" value="credit">
            <mat-icon class="pay-icon">credit_card</mat-icon>
            <span>Credit Card</span>
          </label>
          <label class="payment-type-option">
            <input type="radio" name="paymentType" [(ngModel)]="paymentType" value="paypal">
            <mat-icon class="pay-icon">account_balance_wallet</mat-icon>
            <span>PayPal</span>
          </label>
        </div>
      </div>
      <hr class="checkout-separator" />
      <div *ngIf="paymentType === 'credit'">
        <div class="checkout-row">
          <input class="checkout-input" 
                 [ngClass]="{'input-error': cardNumberError}"
                 [(ngModel)]="cardNumber" 
                 (input)="onCardNumberInput($event)" 
                 placeholder="Card Number" 
                 maxlength="19">
          <div class="input-error-message" *ngIf="cardNumberError">{{cardNumberError}}</div>
        </div>
        <div class="checkout-row">
          <input class="checkout-input" 
                 [ngClass]="{'input-error': cardNameError}"
                 [(ngModel)]="cardName" 
                 (input)="onCardNameInput($event)" 
                 placeholder="Name on Card">
          <div class="input-error-message" *ngIf="cardNameError">{{cardNameError}}</div>
        </div>
        <div class="checkout-row checkout-row-split">
          <input class="checkout-input half" 
                 [ngClass]="{'input-error': cardExpError}"
                 [(ngModel)]="cardExp" 
                 (input)="onCardExpInput($event)" 
                 placeholder="MM/YY" 
                 maxlength="5">
          <input class="checkout-input half" 
                 [ngClass]="{'input-error': cardCvcError}"
                 [(ngModel)]="cardCvc" 
                 (input)="onCardCvcInput($event)" 
                 placeholder="CVC" 
                 maxlength="4">
        </div>
        <div class="input-error-message" *ngIf="cardExpError">{{cardExpError}}</div>
        <div class="input-error-message" *ngIf="cardCvcError">{{cardCvcError}}</div>
      </div>
      <div *ngIf="paymentType === 'paypal'">
        <div class="checkout-row">
          <input class="checkout-input" 
                 [ngClass]="{'input-error': emailError}"
                 [(ngModel)]="email" 
                 (input)="onEmailInput($event)" 
                 placeholder="PayPal Email">
          <div class="input-error-message" *ngIf="emailError">{{emailError}}</div>
        </div>
      </div>
      <hr class="checkout-separator" />
      <div class="checkout-summary">
        <div class="checkout-summary-label">Total:</div>
        <div class="checkout-summary-value checkout-total-badge">${{ data.total }}</div>
      </div>
      <div class="checkout-actions-row">
        <button mat-stroked-button (click)="close()">Cancel</button>
        <button mat-raised-button color="primary" (click)="pay()" [disabled]="!isValid() || loading">
          <mat-icon *ngIf="!loading">credit_score</mat-icon>
          <span *ngIf="loading">Processing...</span>
          <span *ngIf="!loading">Pay Now</span>
        </button>
      </div>
      <div *ngIf="success" class="checkout-success">
        <mat-icon>check_circle</mat-icon> Payment successful! Thank you for your order.
      </div>
    </div>
  </div>
</div>

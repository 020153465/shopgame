<section class="cart-section">
  <h2 class="cart-title">Your Cart</h2>
  
  <!-- Login Required Message -->
  <div *ngIf="!isAuthenticated()" class="login-required">
    <mat-icon class="lock-icon">lock</mat-icon>
    <h3>Login Required</h3>
    <p>Please login to view and manage your cart.</p>
    <button mat-raised-button color="primary" routerLink="/login">
      <mat-icon>login</mat-icon>
      Login
    </button>
    <button mat-stroked-button routerLink="/register">
      <mat-icon>person_add</mat-icon>
      Register
    </button>
  </div>

  <!-- Cart Content (only shown when authenticated) -->
  <div *ngIf="isAuthenticated()">
    <div *ngIf="cartItems.length === 0" class="empty-cart">Your cart is empty.</div>
    <div *ngFor="let item of cartItems" class="cart-item">
      <img class="cart-item-image" [src]="item.game.coverImageUrl" [alt]="item.game.title">
      <div class="cart-item-details">
        <h3 class="cart-item-title">{{ item.game.title }}</h3>
        <div class="cart-item-price">${{ item.game.price }}</div>
        <div class="cart-item-qty">
          <button class="qty-btn" (click)="updateQuantity(item.game.id, item.quantity - 1)">-</button>
          <span>{{ item.quantity }}</span>
          <button class="qty-btn" (click)="updateQuantity(item.game.id, item.quantity + 1)">+</button>
        </div>
        <button class="remove-btn" (click)="removeFromCart(item.game.id)">Remove</button>
      </div>
    </div>
    <div *ngIf="cartItems.length > 0" class="cart-summary">
      <button class="clear-cart-btn" (click)="clearCart()">Clear Cart</button>
      <div class="cart-total">Total: ${{ getTotal() }}</div>
      <button class="checkout-btn" (click)="checkout()" [disabled]="loading">
        <mat-icon *ngIf="!loading">shopping_cart_checkout</mat-icon>
        <span *ngIf="loading">Processing...</span>
        <span *ngIf="!loading">Checkout</span>
      </button>
    </div>
  </div>
</section>

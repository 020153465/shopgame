<div class="admin-panel">
  <h2>Shopping Cart</h2>
  <div *ngFor="let item of cartItems" class="cart-item">
    <img [src]="item.game?.coverImageUrl" [alt]="item.game?.title" class="cart-item-image">
    <div class="cart-item-details">
      <h3>{{ item.game?.title }}</h3>
      <p>Price: ${{ item.game?.price }}</p>
      <p>Quantity: {{ item.quantity }}</p>
    </div>
    <div class="cart-item-actions">
      <button mat-icon-button (click)="item.game?.id !== undefined && updateQuantity(item.game.id, item.quantity - 1)" [disabled]="item.game?.id === undefined">
        <mat-icon>remove</mat-icon>
      </button>
      <button mat-icon-button (click)="item.game?.id !== undefined && updateQuantity(item.game.id, item.quantity + 1)" [disabled]="item.game?.id === undefined">
        <mat-icon>add</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="item.game?.id !== undefined && removeFromCart(item.game.id)" [disabled]="item.game?.id === undefined">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
  <div *ngIf="cartItems.length === 0">
    <p>Your cart is empty.</p>
  </div>
  <div *ngIf="cartItems.length > 0" class="button-container">
    <button mat-raised-button color="warn" (click)="clearCart()">Clear Cart</button>
    <span class="cart-total">Total: ${{ getTotal() }}</span>
  </div>
</div>

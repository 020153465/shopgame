<div class="cart-bg-animated">
<section class="cart-root">
  <h1 class="cart-title">Your Cart</h1>
  <div *ngIf="!isAuthenticated()" class="cart-login-required">
    <mat-icon>lock</mat-icon>
    <p>Please log in to view your cart.</p>
  </div>
  <div *ngIf="isAuthenticated() && cartItems.length === 0" class="cart-empty">
    <mat-icon>shopping_cart</mat-icon>
    <p>Your cart is empty.</p>
  </div>
  <div *ngIf="isAuthenticated() && cartItems.length > 0">
    <div class="cart-list">
      <div class="cart-card" *ngFor="let item of cartItems; trackBy: trackByGameId" [class.card-fade-in]="item.fadeIn" [class.card-fade-out]="item.fading">
        <img class="cart-img" [src]="item.game.coverImageUrl" [alt]="item.game.title">
        <div class="cart-info">
          <div class="cart-game-title">{{ item.game.title }}</div>
          <div class="cart-game-price">${{ item.game.price }}</div>
          <div class="cart-controls-row">
            <div class="cart-qty-row">
              <button mat-mini-fab color="primary" (click)="updateQuantity(item.game.id, item.quantity - 1)"><mat-icon>remove</mat-icon></button>
              <span class="cart-qty">{{ item.quantity }}</span>
              <button mat-mini-fab color="primary" (click)="updateQuantity(item.game.id, item.quantity + 1)"><mat-icon>add</mat-icon></button>
            </div>
            <button class="cart-remove-btn" (click)="animateRemove(item.game.id)"><mat-icon>delete</mat-icon> Remove</button>
          </div>
        </div>
      </div>
    </div>
    <hr class="cart-summary-divider" />
    <div class="cart-summary-row">
      <button mat-stroked-button color="warn" (click)="clearCart()">Clear Cart</button>
      <div class="cart-total">Total: ${{ getTotal() }}</div>
      <button mat-raised-button class="cart-checkout-btn cart-checkout-btn-override" (click)="openCheckout()" [disabled]="cartItems.length === 0">
        <mat-icon>shopping_cart_checkout</mat-icon>
        Checkout
      </button>
    </div>
  </div>
</section>
</div>

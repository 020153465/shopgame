<div class="shop-section">
  <h1>Shop Games</h1>
  <div *ngIf="loading">Loading games...</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>
  <div class="games-grid" *ngIf="!loading && !error">
    <mat-card class="game-card" *ngFor="let game of games">
      <img mat-card-image [src]="getImage(game.coverImageUrl)" [alt]="game.title" class="game-card-image">
      <mat-card-header>
        <mat-card-title>{{ game.title }}</mat-card-title>
        <mat-card-subtitle>{{ game.publisher }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ game.description | slice:0:100 }}...</p>
        <p><strong>Price:</strong> ${{ game.price }}</p>
        <p><strong>Genres:</strong> {{ game.genres }}</p>
        <p><strong>Platforms:</strong> {{ game.platforms }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" [routerLink]="['/game', game.id]">Details</button>
        <button mat-raised-button color="accent" (click)="addToCart(game)">Add to Cart</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>

<section class="shop-section">
  <h1 class="shop-title"><span class="shop-icon">🛒</span> Shop Games</h1>
  <div class="shop-filters">
    <input class="search-input" type="text" placeholder="Search games" [(ngModel)]="searchTerm" (keyup.enter)="searchGames()">
    <select class="genre-select" [(ngModel)]="selectedGenre" (change)="filterByGenre()">
      <option value="">All Genres</option>
      <option *ngFor="let genre of genres" [value]="genre">{{ genre }}</option>
    </select>
  </div>
  <div *ngIf="loading" class="loading">Loading games...</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>
  <div class="games-grid" *ngIf="!loading && !error">
    <div class="game-card" *ngFor="let game of games" (click)="viewGameDetails(game.id)">
      <div class="card-image-container">
        <img class="game-image" [src]="getImage(game.coverImageUrl)" [alt]="game.title">
        <div class="image-overlay">
          <div class="overlay-content">
            <span class="view-details">View Details</span>
          </div>
        </div>
        <div class="price-badge">${{ game.price }}</div>
      </div>
      <div class="game-info">
        <h2 class="game-title">{{ game.title }}</h2>
        <div class="game-publisher">{{ game.publisher }}</div>
        <div class="genre-badges">
          <span *ngFor="let genre of game.genres.split(',')" class="genre-badge">{{ genre.trim() }}</span>
        </div>
        <p class="game-desc">{{ game.description | slice:0:80 }}...</p>
      </div>
      <div class="game-actions">
        <button class="details-btn" (click)="viewGameDetails(game.id); $event.stopPropagation()">
          <mat-icon>info</mat-icon> Details
        </button>
        <button 
          class="add-cart-btn" 
          [class.login-required]="!isAuthenticated()"
          (click)="addToCart(game); $event.stopPropagation()"
          [disabled]="!isAuthenticated()">
          <mat-icon>add_shopping_cart</mat-icon>
          {{ isAuthenticated() ? 'Add to Cart' : 'Login to Buy' }}
        </button>
      </div>
    </div>
  </div>
  <div class="pagination" *ngIf="totalPages > 1 && !loading && !error">
    <button class="page-btn" (click)="prevPage()" [disabled]="page === 0">Prev</button>
    <span class="page-info">Page {{ page + 1 }} of {{ totalPages }}</span>
    <button class="page-btn" (click)="nextPage()" [disabled]="page === totalPages - 1">Next</button>
  </div>
</section>

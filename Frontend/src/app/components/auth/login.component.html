<section class="auth-section">
  <div class="auth-card">
    <h2 class="auth-title">Login</h2>
    <form (ngSubmit)="login()" class="auth-form">
      <input class="auth-input" type="text" placeholder="Username" [(ngModel)]="username" name="username" required>
      <input class="auth-input" type="password" placeholder="Password" [(ngModel)]="password" name="password" required>
      <div *ngIf="error" class="auth-error">{{ error }}</div>
      <button class="auth-btn" type="submit" [disabled]="loading">Login</button>
    </form>
    <div class="auth-link">
      <a routerLink="/register">Don't have an account? Register</a>
    </div>
  </div>
</section>

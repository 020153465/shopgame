<section class="auth-section">
  <div class="auth-card">
    <h2 class="auth-title">Register</h2>
    <form (ngSubmit)="register()" class="auth-form">
      <input class="auth-input" type="text" placeholder="Username" [(ngModel)]="username" name="username" required>
      <input class="auth-input" type="email" placeholder="Email" [(ngModel)]="email" name="email" required>
      <input class="auth-input" type="text" placeholder="First Name" [(ngModel)]="firstName" name="firstName" required>
      <input class="auth-input" type="text" placeholder="Last Name" [(ngModel)]="lastName" name="lastName" required>
      <input class="auth-input" type="password" placeholder="Password" [(ngModel)]="password" name="password" required>
      <div *ngIf="error" class="auth-error">{{ error }}</div>
      <button class="auth-btn" type="submit" [disabled]="loading">Register</button>
    </form>
    <div class="auth-link">
      <a routerLink="/login">Already have an account? Login</a>
    </div>
  </div>
</section>

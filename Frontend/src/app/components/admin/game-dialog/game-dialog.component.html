<div class="game-dialog">
  <h2 mat-dialog-title>{{ isEditMode ? 'Edit Game' : 'Add New Game' }}</h2>
  
  <mat-dialog-content>
    <form class="game-form">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Title</mat-label>
          <input matInput [(ngModel)]="game.title" name="title" required>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <textarea matInput [(ngModel)]="game.description" name="description" rows="3"></textarea>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Price</mat-label>
          <input matInput type="number" [(ngModel)]="game.price" name="price" min="0" step="0.01" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Stock Quantity</mat-label>
          <input matInput type="number" [(ngModel)]="game.stockQuantity" name="stockQuantity" min="0" required>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Genres (comma-separated)</mat-label>
          <input matInput [(ngModel)]="game.genres" name="genres" placeholder="RPG, Action, Adventure">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Platforms (comma-separated)</mat-label>
          <input matInput [(ngModel)]="game.platforms" name="platforms" placeholder="PC, PS4, Xbox">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Development Team</mat-label>
          <input matInput [(ngModel)]="game.devTeam" name="devTeam">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Publisher</mat-label>
          <input matInput [(ngModel)]="game.publisher" name="publisher">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-checkbox [(ngModel)]="game.featured" name="featured" (change)="onFeaturedChange()" [disabled]="maxFeaturedReached && !isEditMode">
          Featured Game
        </mat-checkbox>
        <span class="featured-info" *ngIf="maxFeaturedReached && !isEditMode">
          (Maximum 10 featured games reached)
        </span>
      </div>

      <div class="file-upload-section">
        <h3>Cover Image</h3>
        <div class="file-upload">
          <input type="file" #coverInput (change)="onCoverFileSelected($event)" accept="image/*" style="display: none;">
          <button mat-stroked-button type="button" (click)="coverInput.click()">
            <mat-icon>upload</mat-icon>
            Choose Cover Image
          </button>
          <button mat-icon-button type="button" (click)="removeCover()" *ngIf="coverPreview">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <div class="preview" *ngIf="coverPreview">
          <img [src]="coverPreview" alt="Cover preview" class="cover-preview">
        </div>
      </div>

      <div class="file-upload-section">
        <h3>Music File</h3>
        <div class="file-upload">
          <input type="file" #musicInput (change)="onMusicFileSelected($event)" accept="audio/*" style="display: none;">
          <button mat-stroked-button type="button" (click)="musicInput.click()">
            <mat-icon>upload</mat-icon>
            Choose Music File
          </button>
          <button mat-icon-button type="button" (click)="removeMusic()" *ngIf="musicPreview">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <div class="preview" *ngIf="musicPreview">
          <p class="music-preview">{{ musicPreview }}</p>
        </div>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!game.title || game.price < 0">
      {{ isEditMode ? 'Update' : 'Create' }}
    </button>
  </mat-dialog-actions>
</div>

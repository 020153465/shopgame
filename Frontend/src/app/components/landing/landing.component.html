<div class="landing-bg">
  <div class="animated-gradient"></div>
  <div class="landing-content">
    <div class="logo-row">
      <img src="https://img.icons8.com/ios-filled/100/ffffff/controller.png" class="logo-icon" alt="ShopGame Logo">
      <span class="brand-title">ShopGame</span>
    </div>
    <h1 class="tagline">Level Up Your Game Library</h1>
    <p class="subtitle">Discover, collect, and play the world’s best games. Welcome to the next generation of digital game shopping.</p>
    <div class="featured-covers">
      <img class="cover cover1" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1r6b.png" alt="Cyberpunk 2077">
      <img class="cover cover2" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1tmu.png" alt="The Witcher 3">
      <img class="cover cover3" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1wyy.png" alt="Elden Ring">
      <img class="cover cover4" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1wyy.png" alt="Red Dead Redemption 2">
      <img class="cover cover5" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1wyy.png" alt="God of War">
    </div>
    <button mat-raised-button color="accent" class="enter-btn" (click)="enterShop()">
      <mat-icon>play_arrow</mat-icon> Enter Shop
    </button>
    <div class="scroll-down">
      <mat-icon>expand_more</mat-icon>
    </div>
  </div>
</div>

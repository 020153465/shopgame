<div class="landing-bg">
  <div class="animated-gradient"></div>
  <div class="landing-content">
    <div class="logo-row">
      <img src="https://img.icons8.com/ios-filled/100/ffffff/controller.png" class="logo-icon" alt="ShopGame Logo">
      <span class="brand-title">ShopGame</span>
    </div>
    <h1 class="tagline">Level Up Your Game Library</h1>
    <p class="subtitle">Discover, collect, and play the world’s best games. Welcome to the next generation of digital game shopping.</p>
    <div class="featured-covers">
      <img *ngFor="let game of featuredGames" class="cover" [src]="getCoverUrl(game)" [alt]="game.title" />
    </div>
    <button mat-raised-button color="accent" class="enter-btn" (click)="enterShop()">
      <mat-icon>play_arrow</mat-icon> Enter Shop
    </button>
    <div class="scroll-down" (click)="scrollToSection()">
      <mat-icon>expand_more</mat-icon>
    </div>
  </div>
</div>
<div class="landing-scroll-section" id="info-section">
  <h2>Welcome to ShopGame!</h2>
  <p>Discover, collect, and play the world’s best games. More features coming soon...</p>
</div>
